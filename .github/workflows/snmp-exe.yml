name: Build netmap Windows programs

on:
  push:
    branches: [main]
    paths: ['tools/netmap-snmp/**', 'index.html', '.github/workflows/snmp-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install pyinstaller pysnmp paramiko psutil
      - name: Bundle the web page
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/netmap-snmp/web | Out-Null
          Copy-Item index.html tools/netmap-snmp/web/index.html
      - name: Build MAC vendor table (IEEE OUI)
        working-directory: tools/netmap-snmp
        run: python build_oui.py oui.json.gz
      - name: Self-test monitoring service
        shell: pwsh
        working-directory: tools/netmap-snmp
        run: |
          python -c "import os,tempfile,json,urllib.request,time; import netmap_server as S; st=S.Store(tempfile.mkdtemp()); st.settings['port']=18765; sv=S.Service(st,log=print); sv.start(); time.sleep(1); print(json.load(urllib.request.urlopen('http://127.0.0.1:18765/api/ping'))); html=urllib.request.urlopen('http://127.0.0.1:18765/').read().decode('utf-8'); assert 'NETMAP_SERVER' in html; print('protect roundtrip', S.unprotect(S.protect('secret'))=='secret'); t=int(time.time()); st.add_samples([(t-600,'p1',1e6,2e5,1,0,0),(t-300,'p1',3e6,4e5,1,0,0)],{'p1':1e9}); m=json.load(urllib.request.urlopen('http://127.0.0.1:18765/api/mrtg?port=p1')); print('mrtg', {k:len(v['points']) for k,v in m['graphs'].items()}); assert len(m['graphs']['day']['points'])==2 and m['speed']==1e9; print(json.load(urllib.request.urlopen('http://127.0.0.1:18765/api/mrtg/summary'))['ports'].keys()); sv.stop()"
      - name: Self-test log collector
        shell: pwsh
        working-directory: tools/netmap-snmp
        run: |
          python -c "import time,tempfile,netmap_collect as C; ev=[]; lc=C.LogCollector(tempfile.mkdtemp(),on_event=lambda *a:ev.append(a),syslog_port=15514,trap_port=15162); print(lc.start()); C.send_test_syslog('127.0.0.1',15514); C.send_test_trap('127.0.0.1',15162); time.sleep(1.5); lc.stop(); print(ev); assert len(ev)==2; import paramiko; print('paramiko', paramiko.__version__)"
      - name: Self-test SSH monitor parsing
        working-directory: tools/netmap-snmp
        run: |
          python -c "import netmap_sshmon as m; c,si=m.parse_read('Inter-|\n face |\n  eth0: 100 1 0 0 0 0 0 0 200 2 0 0 0 0 0 0\n    lo: 5 1 0 0 0 0 0 0 5 1 0 0 0 0 0 0\n@@NETMAP@@\neth0 up 1000\nlo unknown\n'); print(c,si); assert c['eth0'][:2]==(100,200) and si['eth0']==(True,10**9); p=m.friendly_ports({'nv_wan0_ifname':'eth0'},c,si); print(p); assert p[0][1]=='WAN'"
      - name: Self-test flow collector (NetFlow v5/v9, IPFIX, sFlow)
        working-directory: tools/netmap-snmp
        run: |
          python -c "import time,tempfile,netmap_flow as F,netmap_vendors as V; c=F.FlowCollector(tempfile.mkdtemp(),19055,19343); print(c.start()); [F.send_test('127.0.0.1',19343 if k=='sflow' else 19055,k) for k in ('v5','v9','ipfix','sflow')]; time.sleep(1.5); st=c.status(); print([(e['addr'],e['fmt'],e['flows']) for e in st['exporters']]); t=c.top(60); print(len(t['hosts']),t['total']); assert len(t['hosts'])>=5 and t['total']['rx']>0; c.stop(); assert len(V.VENDORS)>20; print('vendors',len(V.VENDORS)); import netmap_server as S; n=S.local_nics(); print('nics',list(n)); assert n; print('self ips',S.self_ips())"
      - name: Self-test ping, alerts, history and permissions
        working-directory: tools/netmap-snmp
        run: python selftest_ops.py
      - name: Build netmap.exe (window app)
        working-directory: tools/netmap-snmp
        run: pyinstaller --onefile --windowed --name netmap --icon netmap.ico --collect-all pysnmp --add-data "web/index.html;web" --add-data "netmap.ico;." --add-data "netmap.png;." --add-data "oui.json.gz;." --hidden-import paramiko --hidden-import netmap_collect --hidden-import netmap_sshmon --hidden-import netmap_flow --hidden-import netmap_vendors --hidden-import netmap_alert --hidden-import psutil netmap_app.py
      - name: Build netmap-snmp.exe (command line)
        working-directory: tools/netmap-snmp
        run: pyinstaller --onefile --console --name netmap-snmp --icon netmap.ico --collect-all pysnmp --add-data "oui.json.gz;." netmap_snmp.py
      - name: Smoke test command line
        working-directory: tools/netmap-snmp
        run: dist\netmap-snmp.exe --version-info
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snmp-latest
          name: netmap Windows 程式（SNMP 掃描與監控）
          make_latest: true
          overwrite_files: true
          files: |
            tools/netmap-snmp/dist/netmap.exe
            tools/netmap-snmp/dist/netmap-snmp.exe
            tools/netmap-snmp.zip
          body: |
            機房線路對應圖的 Windows 程式。
            - **netmap.exe**（建議）：視窗版。SNMP 掃描 + 監控服務：在內網提供網頁版線路圖，顯示每個埠的流量、使用率、上下線與 24 小時曲線。
            - netmap-snmp.exe：命令列版掃描程式。
            - netmap-snmp.zip：Python 版（Windows / macOS / Linux）。
            線上版：https://coloplay1.github.io/netmap/
